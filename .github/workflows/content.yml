name: Video director content checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-director-content-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate distributed content
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { checkContent } from './scripts/content-check.mjs';
          const result = checkContent(process.cwd());
          assert.deepEqual(result.errors, []);
          console.log(`Content: ${result.skills} skills, prompt layers, local references and provenance passed.`);
          NODE
      - name: Test package and application wrapper
        run: node --test tests/*.test.mjs

# The platform Schema check remains a separate local validation against the
# reviewed DesireCore checkout; this workflow needs no private-repository access.
